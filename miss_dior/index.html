<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Miss Dior — Site Takeover</title>
<link rel="icon" href="data:," />

<script>
  /* Pre-paint theme restore, inline so the first paint is already final
     (no black flash on a saved light theme). Blocked storage => default dark. */
  try {
    if (localStorage.getItem('metads:host-theme') === 'light')
      document.documentElement.dataset.theme = 'light';
  } catch (e) {}
</script>

<style>
  /* ---------------------------------------------------------------
     MOCKUP CALIBRATION
     The screen rect is expressed as a percentage of the mockup image
     so the iframe stays glued to the laptop display at any scale.
       mockup-w = screen-w / disp-w = 1280 / 0.4305 = 2973.29px
       mockup-h = mockup-w * 3068/4600 = 1982.87px
       screen   = 2973.29*0.4305 x 1982.87*0.4065 = 1280 x 806
     --mockup-scale is a pure visual zoom; the iframe's CSS pixel size
     never changes, so the campaign always renders at 1280x806.
     --------------------------------------------------------------- */
  :root {
    --disp-left: 28.28%;
    --disp-top: 23.22%;
    --disp-w: 0.4305;
    --disp-h: 0.4065;
    --screen-w: 1280px;
    --mockup-w: calc(var(--screen-w) / var(--disp-w));
    --mockup-scale: 1;

    --host-bg: #000;
    --host-fg: #fff;
  }

  html[data-theme='light'] {
    --host-bg: #fff;
    --host-fg: #000;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: var(--host-bg);
    transition: background-color 0.2s;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* Fixed-size, centered stage. Never reflows on window resize —
     it just gets clipped, exactly like the reference. */
  .stage {
    position: fixed;
    top: 50%;
    left: 50%;
    width: var(--mockup-w);
    aspect-ratio: 4600 / 3068;
    transform: translate(-50%, -50%) scale(var(--mockup-scale, 1));
  }

  .stage__pic { position: absolute; inset: 0; display: block; }
  .stage__pic--light { display: none; }
  html[data-theme='light'] .stage__pic--dark { display: none; }
  html[data-theme='light'] .stage__pic--light { display: block; }

  .stage__img {
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .stage__screen {
    position: absolute;
    left: var(--disp-left);
    top: var(--disp-top);
    width: calc(var(--disp-w) * 100%);
    height: calc(var(--disp-h) * 100%);
    z-index: 10;
    background: #000;
    border: 0;
  }

  /* ---------------------------------------------------------------
     FALLBACK FRAME
     macbook.png / macbook-light.png are not redistributable, so if
     they're missing we draw a laptop in CSS on the same calibration.
     Drop the real PNGs next to this file and it swaps automatically.
     --------------------------------------------------------------- */
  .stage.is-fallback .stage__pic { display: none; }

  .stage.is-fallback::before {
    content: '';
    position: absolute;
    left: 26.98%;
    top: 21.87%;
    width: 45.65%;
    height: 43.35%;
    border-radius: 1.1% / 1.6%;
    background: linear-gradient(155deg, #4a4d52, #2a2c30 42%, #17181b);
    box-shadow: 0 60px 90px rgba(0, 0, 0, 0.55);
  }

  .stage.is-fallback::after {
    content: '';
    position: absolute;
    left: 19%;
    top: 65.22%;
    width: 62%;
    height: 2.9%;
    border-radius: 0 0 6% 6% / 0 0 90% 90%;
    background: linear-gradient(180deg, #6a6d73, #34363a 60%, #202226);
    box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
  }

  html[data-theme='light'] .stage.is-fallback::before {
    background: linear-gradient(155deg, #d9dbe0, #b9bcc3 42%, #9ea1a8);
  }
  html[data-theme='light'] .stage.is-fallback::after {
    background: linear-gradient(180deg, #f0f1f4, #c9ccd2 60%, #a8abb2);
  }

  /* ---------------------------------------------------------------
     THEME TOGGLE
     Fixed to the window and a body-level sibling of .stage — .stage's
     transform would otherwise trap and scale a fixed descendant.
     --------------------------------------------------------------- */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 20;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--host-fg) 35%, transparent);
    background: color-mix(in srgb, var(--host-bg) 55%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--host-fg);
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  }

  .theme-toggle:hover { background: color-mix(in srgb, var(--host-bg) 75%, transparent); }
  .theme-toggle:focus-visible { outline: 2px solid var(--host-fg); outline-offset: 2px; }

  .theme-toggle__moon { display: none; }
  html[data-theme='light'] .theme-toggle__sun { display: none; }
  html[data-theme='light'] .theme-toggle__moon { display: block; }
</style>
</head>

<body>
  <main class="stage" id="stage" style="--mockup-scale: 0.75" aria-label="MacBook Pro showcase">
    <picture class="stage__pic stage__pic--dark">
      <img class="stage__img" id="mockDark" src="../macbook.png" alt="MacBook Pro"
           width="4600" height="3068" decoding="async" />
    </picture>

    <picture class="stage__pic stage__pic--light">
      <img class="stage__img" src="../macbook-light.png" alt="MacBook Pro"
           width="4600" height="3068" decoding="async" />
    </picture>

    <!-- The laptop display = a fixed 1280x806 desktop window. The campaign
         renders inside, isolated from this host page. -->
    <iframe class="stage__screen"
            src="screen.html"
            title="Showcase content"
            loading="eager"></iframe>
  </main>

  <button id="theme-toggle" class="theme-toggle" type="button"
          aria-pressed="false" aria-label="Toggle background">
    <svg class="theme-toggle__sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="theme-toggle__moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" />
    </svg>
  </button>

<script>
(function () {
  var KEY  = 'metads:host-theme';
  var root = document.documentElement;
  var btn  = document.getElementById('theme-toggle');

  btn.setAttribute('aria-pressed', String(root.dataset.theme === 'light'));

  btn.addEventListener('click', function () {
    var light = root.dataset.theme !== 'light';
    if (light) root.dataset.theme = 'light';
    else delete root.dataset.theme;
    btn.setAttribute('aria-pressed', String(light));
    try { localStorage.setItem(KEY, light ? 'light' : 'dark'); } catch (e) {}
  });

  // Swap to the CSS-drawn laptop if the mockup renders aren't present.
  var img = document.getElementById('mockDark');
  function fallback() { document.getElementById('stage').classList.add('is-fallback'); }
  img.addEventListener('error', fallback);
  if (img.complete && img.naturalWidth === 0) fallback();
})();
</script>
</body>
</html>
