<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BYD — Takeover</title>
<link rel="icon" href="data:," />

<style>
  :root {
    --rail-w:    25.2083vw;  /* 484 / 1920 */
    --content-w: 49.5833vw;  /* 952 / 1920 */
    --banner-h:  11.9792vw;  /* 230 / 1920 */
    --page-bg:   #f6f5f6;
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: auto;
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    background: var(--page-bg);
    scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }

  .banner {
    position: relative;
    width: 100vw;
    height: var(--banner-h);
    z-index: 30;
    background: var(--page-bg);
  }
  .banner img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  .frame {
    display: flex;
    align-items: flex-start;
    background: #000;
  }

  .rail {
    position: sticky;
    top: 0;
    height: 100vh;
    /* width: var(--rail-w); */
    flex-shrink: 0;
    z-index: 20;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .rail video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    pointer-events: none;
  }

  .cta {
    position: absolute;
    left: 50%;
    bottom: 5.93%;          /* y ≈ 999 in 1080 comp */
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 5.5208vw;        /* 106 / 1920 */
    height: 1.6667vw;       /* 32 / 1920 */
    background: #fff;
    color: #000;
    font-size: 0.6771vw;
    line-height: 1;
    letter-spacing: 0.01em;
    text-decoration: none;
    white-space: nowrap;
    border-radius: 0.42vw;
    box-shadow: 0 0.5vw 1.4vw rgba(0, 0, 0, 0.10),
                0 0.1vw 0.3vw rgba(0, 0, 0, 0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta:hover {
    transform: translateX(-50%) translateY(-0.15vw);
    box-shadow: 0 0.8vw 2vw rgba(0, 0, 0, 0.14),
                0 0.1vw 0.3vw rgba(0, 0, 0, 0.06);
  }

  .content {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 10;
  }

  .content img {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    box-shadow: 0 0 2vw rgba(0, 0, 0, 0.07);
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>

<body>

  <header class="banner">
    <img src="top.png" alt="BYD" />
  </header>

  <div class="frame">

  <aside class="rail rail--left">
    <video id="vidLeft" src="left.mp4" muted playsinline preload="auto"
           disablepictureinpicture></video>
    <span class="cta">Learn more</span>
  </aside>

  <main class="content">
    <img src="content.png" alt="" />
  </main>

  <aside class="rail rail--right">
    <video id="vidRight" src="right.mp4" muted playsinline preload="auto"
           disablepictureinpicture></video>
    <span class="cta">Learn more</span>
  </aside>

  </div><!-- /.frame -->

<script>
(function () {
  'use strict';

  var EASE      = 0.14;
  var SNAP      = 0.0004;
  var SEEK_EPS  = 1 / 50;

  var videos   = [document.getElementById('vidLeft'),
                  document.getElementById('vidRight')];
  var duration = 0;
  var current  = 0;
  var ready    = false;

  function scrollProgress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    var p = window.scrollY / max;
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function onMeta() {
    var ds = videos
      .map(function (v) { return v.duration; })
      .filter(function (d) { return isFinite(d) && d > 0; });
    if (!ds.length) return;
    duration = Math.min.apply(Math, ds);
    ready = true;
  }

  videos.forEach(function (v) {
    v.pause();
    v.addEventListener('loadedmetadata', onMeta);
    v.addEventListener('play', function () { v.pause(); });
    if (v.readyState >= 1) onMeta();
  });

  function tick() {
    if (ready) {
      var target = scrollProgress();
      var delta  = target - current;

      if (Math.abs(delta) < SNAP) current = target;
      else current += delta * EASE;

      var t = current * duration;
      if (t > duration - 0.02) t = duration - 0.02;
      if (t < 0) t = 0;

      for (var i = 0; i < videos.length; i++) {
        var v = videos[i];
        if (v.readyState >= 2 && Math.abs(v.currentTime - t) > SEEK_EPS) {
          v.currentTime = t;
        }
      }
    }
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
