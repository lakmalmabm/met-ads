<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metads — Interactive Ad Units</title>
<link rel="icon" href="data:," />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: #fff;
    color: #111;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 24px 64px;
  }

  header {
    text-align: center;
    margin-bottom: 64px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  header p {
    font-size: 1rem;
    color: #666;
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 900px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 28px 24px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .card:hover {
    border-color: #bbb;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
  }

  .card__title {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>

  <header>
    <h1><strong>met</strong>[ads]</h1>
    <p>Interactive ad unit demos</p>
  </header>

  <main class="grid">
    <a class="card" href="/miss_dior">
      <h2 class="card__title">Miss Dior</h2>
    </a>
    <a class="card" href="/byd">
      <h2 class="card__title">BYD</h2>
    </a>
    <a class="card" href="/rockstar">
      <h2 class="card__title">Rockstar</h2>
    </a>
    <a class="card" href="/miss_dior_mobile">
      <h2 class="card__title">Miss Dior Mobile</h2>
    </a>
    <a class="card" href="/miss_dior_mobile_split">
      <h2 class="card__title">Miss Dior Mobile Split</h2>
    </a>
  </main>

</body>
</html>
