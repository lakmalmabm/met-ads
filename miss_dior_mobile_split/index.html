<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Miss Dior — Mobile Interscroller</title>
<link rel="icon" href="data:," />

<style>
  /* ---------------------------------------------------------------
     DIMENSIONS — from spec
       page width   768px
       top section   768 × 1824  (24px L/R padding)
       video         768 × 1152
       bottom        768 × 1824  (24px L/R padding)
     --------------------------------------------------------------- */
  :root {
    --page-w:    768px;
    --section-h: 1824px;
    --video-h:   1152px;
    --video-w:   768px;
    --pad-x:     24px;
    --sk:        #e5e5e5;
    --gap:       12px;
    --r:         4px;
  }

  @media (max-width: 768px) {
    :root {
      --page-w:    448px;
      --section-h: 1824px;
      --video-h:   669px;
      --video-w:   430px;
      --pad-x:     24px;
    }
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: auto;
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    background: #f5f5f5;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    width: var(--page-w);
    max-width: 100%;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05),
                0 20px 50px rgba(0, 0, 0, 0.08);
    /* no overflow:hidden — it breaks position:sticky on the video */
  }

  /* ---------------------------------------------------------------
     PUBLISHER MOCK — skeleton content. z-index 20 so it slides
     OVER the sticky video beneath it.
     --------------------------------------------------------------- */
  .mock {
    position: relative;
    z-index: 20;
    background: #fff;
    min-height: var(--section-h);
    padding: 40px var(--pad-x);
  }
  .mock--bottom { margin-bottom: 75px; }

  /* Shared skeleton bar */
  .s { border-radius: var(--r); background: var(--sk); }

  /* ---- Pattern A: text lines (5-col grid) -------------------- */
  .pa {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap);
    margin-bottom: 16px;
  }
  .pa .s { height: 12px; }
  .pa .s--full { grid-column: span 5; }
  .pa .s--short { grid-column: span 2; }
  .pa .s--3 { grid-column: span 3; }
  .pa .s--1 { grid-column: span 1; }

  /* ---- Pattern B: media block (5-col grid) ------------------- */
  .pb {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap);
    margin-bottom: 16px;
  }
  .pb .s { height: 12px; }
  .pb .s--img { grid-column: span 3; grid-row: span 2; height: auto; min-height: 64px; }
  .pb .s--thumb { grid-column: span 1; height: 64px; }
  .pb .s--3 { grid-column: span 3; }
  .pb .s--2 { grid-column: span 2; }
  .pb .s--1 { grid-column: span 1; }

  /* ---- Pattern C: article row (5-col, split 3+2) ------------- */
  .pc {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: var(--gap);
    margin-bottom: 16px;
  }

  /* Left: thumbnail + text lines */
  .pc__left {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: var(--gap);
    align-content: start;
  }
  .pc__left .s--pic { grid-row: span 6; min-height: 72px; }
  .pc__left .s { height: 12px; }

  /* Right: two mini-cards stacked */
  .pc__right {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .pc__card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    align-content: start;
  }
  .pc__card .s--pic { grid-column: span 1; grid-row: span 3; min-height: 48px; }
  .pc__card .s { height: 12px; }
  .pc__card .s--w1 { grid-column: span 1; }

  /* ---------------------------------------------------------------
     STICKY VIDEO — z-index 10, revealed as mock scrolls past.
     --------------------------------------------------------------- */
  .ad {
    position: sticky;
    bottom: 0;
    z-index: 10;
    width: var(--video-w);
    height: var(--video-h);
    margin: 0 auto;
    /* Was #000. The Blender backdrop is a light grey gradient (sampled
       #dadddf -> #abadae down the frame), so grey fails far less visibly
       than black during load. */
    background: #d5d6d8;
    overflow: hidden;
  }

  /* The canvas replaces the <video> at IDENTICAL geometry. It fills .ad
     exactly, so there is no object-fit: the crop that object-fit:cover used
     to perform is now done by the camera's FOV (see CAM in the script).
     scale(1.08) is kept verbatim - it is what gives the gyro translate its
     overscan, and it is part of the framing match. */
  .ad canvas {
    display: block;
    width: 100%;
    height: 100%;
    transform: scale(1.08);
    will-change: transform;
  }

  /* Load readout. model.glb is ~357 MB unoptimised, so this is not optional. */
  .ad__loader {
    position: absolute;
    inset: 0;
    z-index: 12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #d5d6d8;
    color: #555;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: opacity 0.4s;
  }
  .ad__loader.hidden { opacity: 0; pointer-events: none; }
  .ad__bar {
    width: 140px;
    height: 2px;
    background: rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }
  .ad__bar i {
    display: block;
    width: 0%;
    height: 100%;
    background: #c2185b;
    transition: width 0.2s linear;
  }

  /* Per-part readout. Absolutely positioned INSIDE .ad so the div's fixed
     768x1152 / 430x669 geometry is untouched. __ad.showStats(false) hides it. */
  .ad__stats {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 13;
    margin: 0;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.72);
    color: #333;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre;
    border-radius: 3px;
    pointer-events: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  /* iOS gyro permission prompt */
  .gyro-prompt {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.9);
    color: #000;
    font-size: 13px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    transition: opacity 0.3s;
  }
  .gyro-prompt.hidden { opacity: 0; pointer-events: none; }

  .light-controls {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 12px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #333;
    min-width: 220px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .light-controls h4 {
    margin: 8px 0 4px;
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .light-controls h4:first-child { margin-top: 0; }
  .light-controls .copy-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 6px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
  }
  .light-controls .copy-btn:active { background: #555; }
  .light-controls label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .light-controls input[type=range] {
    flex: 1;
    max-width: 110px;
  }
  .light-controls span.val {
    min-width: 36px;
    text-align: right;
  }

  .ad__placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #666;
    font-size: 14px;
    text-align: center;
    padding: var(--pad-x);
  }
</style>
</head>

    if(patch){
      f=f.replace('void main() {',patch.head+'\nvoid main() {');
      if(patch.color) f=f.replace('#include <color_fragment>','#include <color_fragment>\n'+patch.color);
      if(patch.rough) f=f.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n'+patch.rough);
      if(patch.normal) f=f.replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+patch.normal);
    }
    sh.fragmentShader=f;
  };
  m.customProgramCacheKey=()=>mname+'|'+mask.join('');
  return m;
}

const bottle=gltf.scene;
const tiltRoot=new THREE.Group();tiltRoot.position.copy(PIVOT);scene.add(tiltRoot);
bottle.position.copy(PIVOT).negate();tiltRoot.add(bottle);
const AUTOMAP=new Set([' base glass.002','inner part.002','label.002','spray cap.002'].map(san));
bottle.traverse(o=>{
  if(!o.isMesh) return;
  const objName=((o.parent&&o.parent.type==='Group'&&o.parent!==bottle)?o.parent.name:o.name).replace(/__w(_\d+)?$/,'');
  const g=o.geometry; if(AUTOMAP.has(objName)&&g.attributes.uv1) g.setAttribute('uv',g.attributes.uv1);   /* Blender's active render UV */
  o.material=makeMat(o.material.name,objName);
});

/* ---- model tilt: same rig as before, now on the bottle's pivot ---- */
const _yawAxis=new THREE.Vector3(0,1,0),_pitchAxis=new THREE.Vector3(1,0,0);
const _yawQ=new THREE.Quaternion(),_pitchQ=new THREE.Quaternion();
function applyModelTilt(u,v){
  _yawQ.setFromAxisAngle(_yawAxis,u*THREE.MathUtils.degToRad(MAX_YAW_DEG));
  _pitchQ.setFromAxisAngle(_pitchAxis,v*THREE.MathUtils.degToRad(MAX_PITCH_DEG));
  tiltRoot.quaternion.copy(_yawQ).multiply(_pitchQ);
}

/* ---- sizing: identical frustum rule ---- */
function resize(){
  const w=ad.clientWidth,h=ad.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(H_FOV_RAD/2)/camera.aspect));
  camera.updateProjectionMatrix();
}
resize(); window.addEventListener('resize',resize);
if('ResizeObserver' in window) new ResizeObserver(resize).observe(ad);

let first=true;
function tick(){
  requestAnimationFrame(tick);
  const tu=motionEnabled?targetU:0, tv=motionEnabled?targetV:0;
  currentU+=(tu-currentU)*EASE; currentV+=(tv-currentV)*EASE;
  applyModelTilt(currentU,currentV);
  renderer.render(scene,camera);
  if(first){first=false;requestAnimationFrame(()=>{
    loadedAt=performance.now();
    loaderEl.classList.add('hidden');
    statsEl.textContent='Loaded in '+(loadedAt/1000).toFixed(1)+' s';
    statsEl.style.display='block';
  });}
}
requestAnimationFrame(tick);

window.__ad={
  THREE,scene,camera,renderer,rig,bottle,tiltRoot,
  get loadSeconds(){return loadedAt===null?null:+(loadedAt/1000).toFixed(2);},
  setExposure(v){renderer.toneMappingExposure=v;return v;},
  setEnv(v){scene.environmentIntensity=v;return v;},
  setGain(g){for(const l of rig) l.intensity=l.userData.baseIntensity*g;return g;},
  lights(){return rig.map(l=>[l.name,+l.intensity.toFixed(3)]);},
  motion(on=true){motionEnabled=on;return on?'motion on':'motion off';},
  recenter(){neutralBeta=null;neutralGamma=null;targetU=0;targetV=0;return 'reset';},
  tilt(){return {yawDeg:+(currentU*MAX_YAW_DEG).toFixed(3),pitchDeg:+(currentV*MAX_PITCH_DEG).toFixed(3),
                 source:gyroActive?'gyro':(pointerActive?'pointer':'none')};},
  setTiltRange(y,p){if(typeof y==='number')MAX_YAW_DEG=y;if(typeof p==='number')MAX_PITCH_DEG=p;return {MAX_YAW_DEG,MAX_PITCH_DEG};},
  setInputRange(d){INPUT_RANGE_DEG=d;return d;},
  showStats(on=true){statsEl.style.display=on?'block':'none';return on;},
  mat(name,props){let n=0;scene.traverse(o=>{if(o.isMesh&&o.material.name===name){Object.assign(o.material,props);o.material.needsUpdate=true;n++;}});return n;},
  mats(){const s=new Set();scene.traverse(o=>{if(o.isMesh)s.add(o.material.name);});return [...s].sort();},
};
</script>
