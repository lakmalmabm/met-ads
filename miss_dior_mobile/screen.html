<style>
  /* ---------------------------------------------------------------
     DIMENSIONS — from spec
       page width   768px
       top section   768 × 1824  (24px L/R padding)
       video         768 × 1152
       bottom        768 × 1824  (24px L/R padding)
     --------------------------------------------------------------- */
  :root {
    --page-w:    768px;
    --section-h: 1824px;
    --video-h:   1152px;
    --video-w:   768px;
    --pad-x:     24px;
    --sk:        #e5e5e5;
    --gap:       12px;
    --r:         4px;
  }

  @media (max-width: 768px) {
    :root {
      --page-w:    448px;
      --section-h: 1824px;
      --video-h:   669px;
      --video-w:   430px;
      --pad-x:     24px;
    }
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: auto;
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    background: #f5f5f5;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    width: var(--page-w);
    max-width: 100%;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05),
                0 20px 50px rgba(0, 0, 0, 0.08);
    /* no overflow:hidden — it breaks position:sticky on the video */
  }

  /* ---------------------------------------------------------------
     PUBLISHER MOCK — skeleton content. z-index 20 so it slides
     OVER the sticky video beneath it.
     --------------------------------------------------------------- */
  .mock {
    position: relative;
    z-index: 20;
    background: #fff;
    min-height: var(--section-h);
    padding: 40px var(--pad-x);
  }
  .mock--bottom { margin-bottom: 75px; }

  /* Shared skeleton bar */
  .s { border-radius: var(--r); background: var(--sk); }

  /* ---- Pattern A: text lines (5-col grid) -------------------- */
  .pa {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap);
    margin-bottom: 16px;
  }
  .pa .s { height: 12px; }
  .pa .s--full { grid-column: span 5; }
  .pa .s--short { grid-column: span 2; }
  .pa .s--3 { grid-column: span 3; }
  .pa .s--1 { grid-column: span 1; }

  /* ---- Pattern B: media block (5-col grid) ------------------- */
  .pb {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--gap);
    margin-bottom: 16px;
  }
  .pb .s { height: 12px; }
  .pb .s--img { grid-column: span 3; grid-row: span 2; height: auto; min-height: 64px; }
  .pb .s--thumb { grid-column: span 1; height: 64px; }
  .pb .s--3 { grid-column: span 3; }
  .pb .s--2 { grid-column: span 2; }
  .pb .s--1 { grid-column: span 1; }

  /* ---- Pattern C: article row (5-col, split 3+2) ------------- */
  .pc {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: var(--gap);
    margin-bottom: 16px;
  }

  /* Left: thumbnail + text lines */
  .pc__left {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: var(--gap);
    align-content: start;
  }
  .pc__left .s--pic { grid-row: span 6; min-height: 72px; }
  .pc__left .s { height: 12px; }

  /* Right: two mini-cards stacked */
  .pc__right {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .pc__card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    align-content: start;
  }
  .pc__card .s--pic { grid-column: span 1; grid-row: span 3; min-height: 48px; }
  .pc__card .s { height: 12px; }
  .pc__card .s--w1 { grid-column: span 1; }

  /* ---------------------------------------------------------------
     STICKY VIDEO — z-index 10, revealed as mock scrolls past.
     --------------------------------------------------------------- */
  .ad {
    position: sticky;
    bottom: 0;
    z-index: 10;
    width: var(--video-w);
    height: var(--video-h);
    margin: 0 auto;
    background: #000;
  }

  .ad video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ad__placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #666;
    font-size: 14px;
    text-align: center;
    padding: var(--pad-x);
  }
</style>
